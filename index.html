        @keyframes slideUp {

            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .logo-text {
            font-family: 'Koulen', sans-serif;

        .logo-sub {

            margin-bottom: 20px;

            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .form-control-glass {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Siemreap', sans-serif;
        }
        
        .form-control-glass::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .form-control-glass:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        
        .form-control-glass option {
            color: #333;
            background: white;
        }
        
        .btn-glass {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Koulen', sans-serif;
        }
        
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .btn-glass:active {
            transform: translateY(0);
        }
        
        .btn-glass:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .role-option {
            padding: 10px;
            text-align: center;

            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;

            transition: all 0.3s ease;

        .role-option i {

        }

        }
        
        .role-option.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
        }
        
        .error-message {
            color: #ff6b6b;

            margin-top: 10px;

            background: rgba(255, 0, 0, 0.1);

        .loading-spinner {

        .loading-spinner .spinner {

        // --- ANTI-CHEATING: Generate & Get Device ID ---
        function getOrCreateDeviceId() {
            var deviceId = localStorage.getItem('app_device_id');
            if (!deviceId) {
                // Creates a random 15-character ID specific to this browser/phone
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('app_device_id', deviceId);
            }
            return deviceId;
        }

        window.onload = function() {
            var savedSession = localStorage.getItem('sessionUser');
            if (savedSession) {
                try {
                    var session = JSON.parse(savedSession);
                    if (session.role === 'Student') {
                        if (session.requiresPasswordChange) {
                            window.location.href = 'changepassword.html';
                        } else {
                           window.location.href = 'studentindex.html';
                        }
                    } else {
                        window.location.href = 'admin.html';
                    }
                    return;
                } catch(e) {
                    localStorage.removeItem('sessionUser');
                }
            }
            
            loadCampuses();
            document.getElementById('userId').focus();
        };


async function loadCampuses() {
            var select = document.getElementById('campusSelect');
            select.innerHTML = '<option value="">កំពុងទាញយកទិន្នន័យ...</option>';
            
            try {
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getCampuses' }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow'
                });
                
                // អានទិន្នន័យឆៅសិន មុននឹងបំប្លែងជា JSON ដើម្បីការពារការគាំង
                const text = await response.text(); 
                
                try {
                    const data = JSON.parse(text);
                    
                    if (data.error) {
                        select.innerHTML = '<option value="">កំហុស: ' + data.error + '</option>';
                        if (typeof buildCustomDropdown === 'function') buildCustomDropdown();
                        return;
                    }
                    
                    if (data.success && data.campuses && data.campuses.length > 0) {
                        select.innerHTML = '<option value="">ជ្រើសរើសសាលា...</option>';
                        campuses = data.campuses;
                        data.campuses.forEach(function(campus) {
                            var option = document.createElement('option');
                            option.value = campus.id;
                            option.textContent = campus.nameKH + ' (' + campus.nameEN + ')';
                            option.dataset.nameKH = campus.nameKH;
                            option.dataset.nameEN = campus.nameEN;
                            select.appendChild(option);
                        });
                        
                        // 🌟 បង្កើតបញ្ជី Custom Dropdown បន្ទាប់ពីទាញទិន្នន័យចូល Select ដើមចប់
                        if (typeof buildCustomDropdown === 'function') buildCustomDropdown();
                        
                    } else {
                        select.innerHTML = '<option value="">គ្មានទិន្នន័យសាលាទេ</option>';
                        if (typeof buildCustomDropdown === 'function') buildCustomDropdown();
                    }
                } catch(e) {
                    console.error("ទិន្នន័យឆ្លើយតបមិនមែនជា JSON ទេ:", text);
                    select.innerHTML = '<option value="">Error: ទិន្នន័យពី Server ខុស (ភ្លេច Deploy ថ្មី)</option>';
                    if (typeof buildCustomDropdown === 'function') buildCustomDropdown();
                }
                
            } catch (error) {
                console.error("Network/CORS Error:", error);
                select.innerHTML = '<option value="">Error: មិនអាចភ្ជាប់ទៅកាន់ម៉ាស៊ីនមេ</option>';
                if (typeof buildCustomDropdown === 'function') buildCustomDropdown();
            }
        }

        function updateCampusHeader() {
            var select = document.getElementById('campusSelect');
            var selectedOption = select.options[select.selectedIndex];
            
            if (selectedOption && selectedOption.dataset.nameKH) {
                document.getElementById('campusHeaderKhmer').textContent = selectedOption.dataset.nameKH;
                document.getElementById('campusHeaderEnglish').textContent = selectedOption.dataset.nameEN;
                selectedCampus = {
                    id: select.value,
                    nameKH: selectedOption.dataset.nameKH,
                    nameEN: selectedOption.dataset.nameEN
                };
            } else {
                document.getElementById('campusHeaderKhmer').textContent = 'ប្រព័ន្ធចូលរៀន';
                document.getElementById('campusHeaderEnglish').textContent = 'Attendance Management System';
                selectedCampus = null;
            }
        }
        
        function selectRole(element) {
            document.querySelectorAll('.role-option').forEach(function(el) { el.classList.remove('active'); });
            element.classList.add('active');
            document.getElementById('role').value = element.dataset.role;
        }
        // 🌟 មុខងារបង្កើត Hardware Device Fingerprint ដែលមិនប្រែប្រួលតាម Browser Profiles
        async function getDeviceFingerprint() {
            let components = [];
            
            // 1. Hardware Cores & RAM
            components.push(navigator.hardwareConcurrency || 'unk_core');
            components.push(navigator.deviceMemory || 'unk_mem');
            
            // 2. Screen Specs
            components.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
            components.push(screen.availWidth + 'x' + screen.availHeight);
            
            // 3. Platform & Timezone
            components.push(navigator.platform || 'unk_plat');
            components.push(Intl.DateTimeFormat().resolvedOptions().timeZone || 'unk_tz');
            
            // 4. Canvas Fingerprint (ចាប់ GPU/Graphics Driver Signature របស់ម៉ាស៊ីន)
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('RTTC_DEVICE_ID', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('RTTC_DEVICE_ID', 4, 17);
                components.push(canvas.toDataURL());
            } catch(e) {
                components.push('canvas_err');
            }
        
            // បំប្លែងទិន្នន័យ Hardware ទាំងអស់ទៅជា Hash Code (SHA-256)
            const rawString = components.join('###');
            const msgBuffer = new TextEncoder().encode(rawString);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return 'hw_' + hashHex.substring(0, 24); // ឧទាហរណ៍: hw_8f4b23c91a0e5d...
        }
    async function login(event) {
            event.preventDefault();
            
            var userId = document.getElementById('userId').value.trim();
            var password = document.getElementById('password').value.trim();
            var role = document.getElementById('role').value;
            var campusId = document.getElementById('campusSelect').value;
            
            if (!campusId) { showError('សូមជ្រើសរើសសាលា'); document.getElementById('campusSelect').focus(); return; }
            if (!userId) { showError('សូមបញ្ចូលអត្តលេខ'); document.getElementById('userId').focus(); return; }
            if (!password) { showError('សូមបញ្ចូលពាក្យសម្ងាត់'); document.getElementById('password').focus(); return; }
            
            var loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> កំពុងភ្ជាប់...';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            
            try {
                // 🌟 ហៅប្រើមុខងារ Hardware Fingerprint ថ្មី (ត្រូវមាន await)
                var deviceId = await getDeviceFingerprint(); 
                
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', userId: userId, password: password, role: role, deviceId: deviceId }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ចូលប្រើប្រាស់';
                document.getElementById('loadingSpinner').style.display = 'none';

                if (result.success) {
                    result.campusId = campusId;
                    result.campusName = selectedCampus ? selectedCampus.nameKH : '';
                    localStorage.setItem('sessionUser', JSON.stringify(result));
                    localStorage.setItem('selectedCampus', JSON.stringify(selectedCampus));
                    
                    if (result.role === 'Student') {
                        window.location.href = result.requiresPasswordChange ? 'changepassword.html' : 'studentindex.html';
                    } else {
                        window.location.href = 'admin.html';
                    }
                } else {
                    showError(result.error || 'ពាក្យសម្ងាត់ ឬអត្តលេខមិនត្រឹមត្រូវ');
                }
            } catch(e) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ចូលប្រើប្រាស់';
                document.getElementById('loadingSpinner').style.display = 'none';
                showError('កំហុសបច្ចេកទេស៖ ' + e.message);
            }
        }
        
    function showError(message) {
            document.getElementById('errorText').innerText = message;
            document.getElementById('errorMessage').style.display = 'block';
    }

        // ១. មុខងារសម្រាប់ទាញទិន្នន័យពី Select ចាស់ មកបង្កើតជា Custom Dropdown ថ្មី
function buildCustomDropdown() {
    const selectEl = document.getElementById('campusSelect');
    const customList = document.getElementById('customCampusList');
    const customText = document.getElementById('customCampusText');
    
    // សម្អាតបញ្ជីចាស់ចោលសិន
    customList.innerHTML = '';
    
    // បង្កើតបញ្ជីថ្មីផ្អែកលើ Option ដែលទាញបានពី Server
    Array.from(selectEl.options).forEach(option => {
        const li = document.createElement('li');
        li.className = 'glass-dropdown-item';
        li.textContent = option.text;
        li.setAttribute('data-value', option.value);
        
        // ពេលសិស្សចុចលើសាលាណាមួយ
        li.addEventListener('click', function() {
            customText.textContent = this.textContent;
            selectEl.value = this.getAttribute('data-value'); // បោះតម្លៃលេខចូល Select ចាស់
            
            // 🌟 បញ្ជាឲ្យ onchange="updateCampusHeader()" ដំណើរការ
            selectEl.dispatchEvent(new Event('change'));
            
            document.getElementById('customCampusDropdown').classList.remove('active');
        });
        
        customList.appendChild(li);
    });
    
    // បង្ហាញឈ្មោះសាលាដំបូងគេ (បើមាន)
    if(selectEl.options.length > 0) {
        customText.textContent = selectEl.options[selectEl.selectedIndex].text;
    }
}

// ២. បញ្ជាឲ្យប្រអប់អាចលោតចុះឡើងពេលចុច
document.addEventListener('DOMContentLoaded', function() {
    const dropdown = document.getElementById('customCampusDropdown');
    const selectBox = document.getElementById('customSelectBox');
    
    if(selectBox) {
        selectBox.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('active');
        });
    }
    
    // ចុចក្រៅប្រអប់ ឲ្យវាលាក់ទៅវិញ
    document.addEventListener('click', function() {
        if(dropdown) dropdown.classList.remove('active');
    });
});
    </script>
