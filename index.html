<!DOCTYPE html>
<html lang="km">
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Siemreap&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Siemreap', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .glass-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .logo-text {
            font-family: 'Koulen', sans-serif;
            color: white;
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .logo-sub {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 5px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        .form-group label {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .form-control-glass {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Siemreap', sans-serif;
        }
        
        .form-control-glass::placeholder { color: rgba(255, 255, 255, 0.4); }
        
        .form-control-glass:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        
        .form-control-glass option { color: #333; background: white; }
        
        .btn-glass {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Koulen', sans-serif;
        }
        
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .btn-glass:active { transform: translateY(0); }
        .btn-glass:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .role-selector {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .role-option {
            padding: 10px; text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: rgba(255, 255, 255, 0.6);
            cursor: pointer; transition: all 0.3s ease; font-size: 12px;
        }
        .role-option i { display: block; font-size: 24px; margin-bottom: 5px; }
        .role-option:hover { background: rgba(255, 255, 255, 0.15); }
        .role-option.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
        }
        
        .error-message {
            color: #ff6b6b; font-size: 13px; text-align: center;
            margin-top: 10px; display: none; background: rgba(255, 0, 0, 0.1);
            padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 0, 0, 0.2);
        }
        
        .loading-spinner { display: none; text-align: center; margin-top: 15px; }
        .loading-spinner .spinner {
            width: 30px; height: 30px; border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-text { text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 11px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="logo-container">
            <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="logo-text" id="campusHeaderKhmer">ប្រព័ន្ធវត្តមាន(កំពុងជួសជុល)</div>
            <div class="logo-sub" id="campusHeaderEnglish">RTTCPV AMS</div>
        </div>
        
        <form id="loginForm" onsubmit="login(event)">
            <div class="form-group">
                <label><i class="bi bi-buildings"></i> ជ្រើសរើសសាលា / Campus</label>
                <select id="campusSelect" class="form-control-glass" onchange="updateCampusHeader()">
                    <option value="" style="color: black;">កំពុងផ្ទុក...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-geo-alt"></i> ជ្រើសរើសអគារ (Building)</label>
                <select class="form-control-glass" id="buildingSelect" disabled>
                    <option value="" style="color: black;">-- សូមជ្រើសរើសសាលាជាមុនសិន --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-person-badge"></i> អត្តលេខ / ID</label>
                <input type="text" id="userId" class="form-control-glass" placeholder="បញ្ចូលអត្តលេខរបស់អ្នក" required autofocus>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-lock"></i> ពាក្យសម្ងាត់</label>
                <input type="password" id="password" class="form-control-glass" placeholder="បញ្ចូលពាក្យសម្ងាត់" required>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-person"></i> តួនាទី</label>
                <div class="role-selector">
                    <div class="role-option active" data-role="Student" onclick="selectRole(this)">
                        <i class="bi bi-person-fill"></i>សិស្ស
                    </div>
                    <div class="role-option" data-role="Teacher" onclick="selectRole(this)">
                        <i class="bi bi-person-badge-fill"></i>គ្រូ
                    </div>
                    <div class="role-option" data-role="Admin" onclick="selectRole(this)">
                        <i class="bi bi-shield-fill-check"></i>អេដមីន
                    </div>
                </div>
                <input type="hidden" id="role" value="Student">
            </div>
            
            <button type="submit" class="btn-glass" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i> ចូលប្រើប្រាស់
            </button>
            
            <div class="error-message" id="errorMessage">
                <i class="bi bi-exclamation-circle"></i> <span id="errorText"></span>
            </div>
            
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div style="color: rgba(255,255,255,0.6); margin-top: 10px; font-size: 13px;">កំពុងភ្ជាប់...</div>
            </div>
        </form>
        
        <div class="footer-text"><i class="bi bi-shield-check"></i> ប្រព័ន្ធសុវត្ថិភាពខ្ពស់</div>
    </div>
    
    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbzsrivSdBSb4s3zDaBhEZL-3R8g8ZJrnXGNweJQh8YGIAOyGohJAPzfOWoONj0LZhkg/exec";
        var allCampuses = [];
        var allBuildings = [];
        var selectedCampus = null;
        
        function getOrCreateDeviceId() {
            var deviceId = localStorage.getItem('app_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('app_device_id', deviceId);
            }
            return deviceId;
        }

        window.onload = function() {
            var savedSession = localStorage.getItem('sessionUser');
            if (savedSession) {
                try {
                    var session = JSON.parse(savedSession);
                    if (session.role === 'Student') {
                        if (session.requiresPasswordChange) window.location.href = 'changepassword.html';
                        else window.location.href = 'studentindex.html';
                    } else {
                        window.location.href = 'admin.html';
                    }
                    return;
                } catch(e) {
                    localStorage.removeItem('sessionUser');
                }
            }
            
            loadCampusesAndBuildings();
            document.getElementById('userId').focus();
        };

        async function loadCampusesAndBuildings() {
            var cSelect = document.getElementById('campusSelect');
            var bSelect = document.getElementById('buildingSelect');
            
            try {
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getCampusesAndBuildings' }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const data = await response.json();
                
                if (data.success) {
                    allCampuses = data.campuses || [];
                    allBuildings = data.buildings || [];
                    
                    cSelect.innerHTML = '<option value="" style="color: black;">-- ជ្រើសរើសសាលា --</option>';
                    allCampuses.forEach(c => {
                        cSelect.innerHTML += `<option value="${c.id}" style="color: black;">${c.nameKH}</option>`;
                    });
                } else {
                    cSelect.innerHTML = '<option value="" style="color: black;">កំហុសពី Server</option>';
                }
            } catch (e) {
                cSelect.innerHTML = '<option value="" style="color: black;">បញ្ហាបណ្តាញទាក់ទង</option>';
            }
        }
        
        function updateCampusHeader() {
            var cSelect = document.getElementById('campusSelect');
            var bSelect = document.getElementById('buildingSelect');
            var cId = cSelect.value;
            
            bSelect.innerHTML = '<option value="" style="color: black;">-- ជ្រើសរើសអគារ --</option>';
            
            if (!cId) {
                bSelect.disabled = true;
                document.getElementById('campusHeaderKhmer').textContent = 'ប្រព័ន្ធវត្តមាន(កំពុងជួសជុល)';
                document.getElementById('campusHeaderEnglish').textContent = 'RTTCPV AMS';
                selectedCampus = null;
                return;
            }
            
            bSelect.disabled = false;
            var filteredB = allBuildings.filter(b => b.campusId === cId);
            filteredB.forEach(b => {
                bSelect.innerHTML += `<option value="${b.id}" style="color: black;">${b.name}</option>`;
            });
            
            var campusObj = allCampuses.find(c => c.id === cId);
            if (campusObj) {
                document.getElementById('campusHeaderKhmer').textContent = campusObj.nameKH;
                document.getElementById('campusHeaderEnglish').textContent = campusObj.nameEN;
                selectedCampus = campusObj;
            }
        }
        
        function selectRole(element) {
            document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('role').value = element.dataset.role;
        }

        async function getDeviceFingerprint() {
            let components = [];
            components.push(navigator.hardwareConcurrency || 'unk_core');
            components.push(navigator.deviceMemory || 'unk_mem');
            components.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
            components.push(screen.availWidth + 'x' + screen.availHeight);
            components.push(navigator.platform || 'unk_plat');
            components.push(Intl.DateTimeFormat().resolvedOptions().timeZone || 'unk_tz');
            
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200; canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top'; ctx.font = '14px Arial';
                ctx.fillStyle = '#f60'; ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069'; ctx.fillText('RTTC_DEVICE_ID', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)'; ctx.fillText('RTTC_DEVICE_ID', 4, 17);
                components.push(canvas.toDataURL());
            } catch(e) { components.push('canvas_err'); }

            const rawString = components.join('###');
            if (!window.crypto || !window.crypto.subtle) {
                let hash = 0;
                for (let i = 0; i < rawString.length; i++) {
                    hash = ((hash << 5) - hash) + rawString.charCodeAt(i);
                    hash = hash & hash;
                }
                return 'hw_fb_' + Math.abs(hash).toString(16) + '_' + rawString.length;
            }

            try {
                const msgBuffer = new TextEncoder().encode(rawString);
                const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return 'hw_' + hashHex.substring(0, 24);
            } catch(e) { return getOrCreateDeviceId(); }
        }

        async function login(event) {
            event.preventDefault();
            var userId = document.getElementById('userId').value.trim();
            var password = document.getElementById('password').value.trim();
            var role = document.getElementById('role').value;
            var campusId = document.getElementById('campusSelect').value;
            var buildingId = document.getElementById('buildingSelect').value;
            
            if (!campusId) { showError('សូមជ្រើសរើសសាលា'); document.getElementById('campusSelect').focus(); return; }
            if (role === 'Student' && !buildingId) { showError('សូមជ្រើសរើសអគារ'); document.getElementById('buildingSelect').focus(); return; }
            if (!userId) { showError('សូមបញ្ចូលអត្តលេខ'); document.getElementById('userId').focus(); return; }
            if (!password) { showError('សូមបញ្ចូលពាក្យសម្ងាត់'); document.getElementById('password').focus(); return; }
            
            var loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> កំពុងភ្ជាប់...';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            
            try {
                var deviceId = await getDeviceFingerprint(); 
                
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', userId: userId, password: password, role: role, deviceId: deviceId }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ចូលប្រើប្រាស់';
                document.getElementById('loadingSpinner').style.display = 'none';

                if (result.success) {
                    result.campusId = campusId;
                    result.buildingId = buildingId;
                    result.campusName = selectedCampus ? selectedCampus.nameKH : '';
                    localStorage.setItem('sessionUser', JSON.stringify(result));
                    localStorage.setItem('selectedCampus', JSON.stringify(selectedCampus));
                    
                    if (result.role === 'Student') {
                        window.location.href = result.requiresPasswordChange ? 'changepassword.html' : 'studentindex.html';
                    } else {
                        window.location.href = 'admin.html';
                    }
                } else {
                    showError(result.error || 'ពាក្យសម្ងាត់ ឬអត្តលេខមិនត្រឹមត្រូវ');
                }
            } catch(e) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> ចូលប្រើប្រាស់';
                document.getElementById('loadingSpinner').style.display = 'none';
                showError('កំហុសបច្ចេកទេស៖ ' + e.message);
            }
        }
        
        function showError(message) {
            document.getElementById('errorText').innerText = message;
            document.getElementById('errorMessage').style.display = 'block';
        }
    </script>
</body>
</html>
