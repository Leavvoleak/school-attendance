<!DOCTYPE html>
<html lang="km">
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Siemreap&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Siemreap', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .logo-text {
            font-family: 'Koulen', sans-serif;
            color: white;
            font-size: 22px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .logo-sub {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-control-glass {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Siemreap', sans-serif;
        }
        .form-control-glass::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .form-control-glass:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        .btn-glass {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Koulen', sans-serif;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }
        .btn-glass:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        .success-message {
            color: #69db7c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
            background: rgba(0, 255, 0, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="bi bi-key-fill"></i>
            </div>
            <div class="logo-text">ប្តូរពាក្យសម្ងាត់</div>
            <div class="logo-sub">Change Password</div>
        </div>
        
        <form id="changePassForm" onsubmit="changePassword(event)">
            <div class="form-group">
                <label><i class="bi bi-person-badge"></i> អត្តលេខ</label>
                <input type="text" id="studentId" class="form-control-glass" readonly>
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-lock"></i> ពាក្យសម្ងាត់ថ្មី</label>
                <input type="password" id="newPassword" class="form-control-glass" placeholder="បញ្ចូលពាក្យសម្ងាត់ថ្មី" required minlength="4">
            </div>
            
            <div class="form-group">
                <label><i class="bi bi-lock-fill"></i> បញ្ជាក់ពាក្យសម្ងាត់</label>
                <input type="password" id="confirmPassword" class="form-control-glass" placeholder="បញ្ចូលពាក្យសម្ងាត់ម្តងទៀត" required>
            </div>
            
            <button type="submit" class="btn-glass" id="changeBtn">
                <i class="bi bi-check-circle"></i> ប្តូរពាក្យសម្ងាត់
            </button>
            
            <div class="error-message" id="errorMessage">
                <i class="bi bi-exclamation-circle"></i> <span id="errorText"></span>
            </div>
            
            <div class="success-message" id="successMessage">
                <i class="bi bi-check-circle-fill"></i> <span id="successText"></span>
            </div>
        </form>
    </div>
    
    <script>
        var sessionUser = null;
        
      window.onload = function() {
                  var savedSession = localStorage.getItem('sessionUser');
                  if (!savedSession) {
                          window.location.href = 'Index.html';
                      return;
                  }
                  
                  sessionUser = JSON.parse(savedSession);
                  if (sessionUser.role !== 'Student') {
                      window.location.href = 'Index.html';
                      return;
                  }
                  document.getElementById('studentId').value = sessionUser.id;
              };
        
      async function changePassword(event) {
            event.preventDefault();
            
            var newPass = document.getElementById('newPassword').value.trim();
            var confirmPass = document.getElementById('confirmPassword').value.trim();
            
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            
            if (newPass.length < 4) {
                showError('ពាក្យសម្ងាត់ត្រូវមានយ៉ាងតិច 4 តួ');
                return;
            }
            
            if (newPass !== confirmPass) {
                showError('ពាក្យសម្ងាត់ទាំងពីរមិនដូចគ្នាទេ');
                return;
            }
            
            document.getElementById('changeBtn').disabled = true;
            document.getElementById('changeBtn').innerHTML = '<i class="bi bi-hourglass-split"></i> កំពុងដំណើរការ...';
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbwNHlULVXlao5XGpQxq8UeGJ_CBo1rEGvP3ZqWfl3Qh9vDaMdfV7i59Id4RhkWFoczhzg/exec", {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updatePassword', studentId: sessionUser.id, newPassword: newPass }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if (result.success) {
                    showSuccess('បានប្តូរពាក្យសម្ងាត់ដោយជោគជ័យ');
                    sessionUser.password = newPass;
                    sessionUser.requiresPasswordChange = false;
                    localStorage.setItem('sessionUser', JSON.stringify(sessionUser));
                    
                    setTimeout(() => { window.location.href = 'StudentIndex.html'; }, 2000);
                } else { showError(result.error); }
            } catch(e) { showError('កំហុស៖ ' + e.message); }
            
            document.getElementById('changeBtn').disabled = false;
            document.getElementById('changeBtn').innerHTML = '<i class="bi bi-check-circle"></i> ប្តូរពាក្យសម្ងាត់';
        }
        
        function showError(message) {
            document.getElementById('errorText').innerText = message;
            document.getElementById('errorMessage').style.display = 'block';
        }
        
        function showSuccess(message) {
            document.getElementById('successText').innerText = message;
            document.getElementById('successMessage').style.display = 'block';
        }
    </script>
</body>
</html>
